<!DOCTYPE html>
<html>
<head>
    <title>Token Generator</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 2em; }
        input, button { margin: 0.5em 0; padding: 0.5em; width: 300px; }
    </style>
</head>
<body>

<h1>Generate Token</h1>

<p>
    Enter <b>Key 1</b> and <b>Key 2</b> to generate the authentication token.
</p>

<form method="post" action="/calculate-tokenized">
    <label>Key 1:</label>
    <input type="text" name="key1" required><br>

    <label>Key 2:</label>
    <input type="text" name="key2" required><br>

    <button type="submit">Calculate Token</button>
</form>

{% if result %}
    <h2>Token Result:</h2>
    <p><b>{{ result }}</b></p>
{% endif %}

<a href="/">⬅ Back to Homepage</a>

</body>
</html>
